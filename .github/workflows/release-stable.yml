# Publishes a release for every push to stable.
#
# The version follows upstream's package.json version with a fork suffix:
#   <upstream version>-tci-<short commit hash>   e.g. 1.5.0-tci-0a379a4
#
# The tag points to a release commit (child of the stable commit) carrying that version in the
# package manifests, the MCP server metadata and the Unity Server Window
# (see .github/scripts/stamp-version.mjs). stable itself always keeps the base version.
#
# The release branch is force-moved to the latest release commit. It is written only by this
# workflow; never commit to it. Install from it to follow releases with the full version shown:
#   "com.gamelovers.mcp-unity": "https://github.com/tc-interactive/mcp-unity.git#release"
# or pin an exact release by tag:
#   "com.gamelovers.mcp-unity": "https://github.com/tc-interactive/mcp-unity.git#1.5.0-tci-0a379a4"
name: Release stable

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server~/package-lock.json

      - name: Install Node server dependencies
        working-directory: Server~
        run: npm ci

      - name: Build Node server
        working-directory: Server~
        run: npm run build

      - name: Test Node server
        working-directory: Server~
        run: npm test

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          server=$(node -p "require('./Server~/package.json').version")
          if [ "$base" != "$server" ]; then
            echo "::error::package.json ($base) and Server~/package.json ($server) versions differ"
            exit 1
          fi
          short=$(git rev-parse --short=7 HEAD)
          version="$base-tci-$short"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $version already exists; nothing to release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Previous fork release, for the release notes range
          previous=$(git tag --list '*-tci-*' --sort=-creatordate | head -n 1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Manifests, lockfile, MCP server/dashboard metadata and the Unity Server Window version
          node .github/scripts/stamp-version.mjs "$VERSION"
          git diff --stat
          # Make sure the stamped sources still build before tagging them
          (cd Server~ && npm run build)
          git commit -am "chore(release): $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION (from stable $GITHUB_SHA)"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          notes_args=(--generate-notes)
          if [ -n "$PREVIOUS" ]; then
            notes_args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" --verify-tag --title "$VERSION" --latest "${notes_args[@]}"

      # Also runs when the tag already exists, so a manual run re-syncs the branch
      - name: Move release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Never move the branch backwards: only release the current tip of stable
          git fetch origin stable
          if [ "$(git rev-parse origin/stable)" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_SHA is not the tip of stable; leaving the release branch unchanged"
            exit 0
          fi
          commit=$(git rev-parse "refs/tags/$VERSION^{commit}")
          git push --force origin "$commit:refs/heads/release"
          echo "release -> $commit ($VERSION)"
